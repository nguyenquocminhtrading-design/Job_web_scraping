version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: lm_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  api:
    build: .
    command: uvicorn layer5_output.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mongodb
    volumes:
      - .:/app

  dashboard:
    build: .
    command: streamlit run layer5_output/dashboard/app.py
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api
    volumes:
      - .:/app

volumes:
  mongodb_data:
