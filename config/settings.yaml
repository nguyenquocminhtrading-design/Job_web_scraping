scraping:
  delay_min: 2
  delay_max: 5
  max_retries: 3
  timeout: 30
  max_pages: 3          # số trang kết quả search quét cho mỗi từ khóa (dừng sớm nếu hết)
  respect_robots_txt: true

pipeline:
  # Nguồn sẽ cào (topcv/careerviet chưa implement — thêm vào khi sẵn sàng)
  sources:
    - vietnamworks
  # Tỷ giá quy đổi USD -> VND (có thể override bằng env USD_VND_RATE)
  usd_to_vnd: 26000

database:
  db_name: "labor_market_vn"

schedule:
  weekly_scrape: "0 2 * * 1"
  daily_trend: "0 6 * * *"
